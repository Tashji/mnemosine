[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemosine"
version = "0.8.0"
description = "Architettura cognitiva locale su MCP: identità, memoria, biografia e autonomia controllata per agenti AI."
readme = "README.MD"
requires-python = ">=3.12"
keywords = ["mcp", "agent-memory", "rag", "faiss", "sqlite", "cognitive-architecture"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: OS Independent",
]
dependencies = [
  # Server MCP (FastMCP incluso in mcp>=1.30,<2).
  "mcp>=1.30,<2",
  # Embedding locale multilingue (ONNX Runtime, nessuna API esterna).
  "fastembed==0.9.0",
  # Indice vettoriale persistente.
  "faiss-cpu>=1.9,<2",
  # Operazioni sui vettori.
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
# Browser controllato: richiede anche `python -m playwright install chromium`.
browser = ["playwright>=1.49,<2"]
# Generazione opzionale su Replicate; installare le dipendenze solo se usata.
visual = ["replicate>=1.0,<2", "Pillow>=10"]
dev = ["ruff>=0.6"]

[project.scripts]
mnemosine-start = "agent_memory.start:main"
mnemosine = "agent_memory.server:main"
mnemosine-dashboard = "agent_memory.dashboard:main"
mnemosine-profile = "agent_memory.profile:main"
mnemosine-biography = "agent_memory.biography:main"
mnemosine-index = "agent_memory.index:main"
mnemosine-heartbeat = "agent_memory.heartbeat:main"
mnemosine-browser = "agent_memory.browser:main"
mnemosine-browser-login = "agent_memory.browser_login:main"
mnemosine-visual-token = "agent_memory.visual_token:main"

[tool.setuptools]
packages = ["agent_memory"]

[tool.setuptools.package-data]
agent_memory = ["dashboard_assets/*", "schemas/*"]
