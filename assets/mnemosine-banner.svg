<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Mnemosine</title>
  <desc id="banner-desc">Banner sottile con l'emblema, il nome del progetto e la sua linea d'identità.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a12"/>
      <stop offset="0.55" stop-color="#0b1422"/>
      <stop offset="1" stop-color="#08111d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6ee7d8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6ee7d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8b36a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#d8b36a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="190" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1200" height="190" rx="16" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <ellipse cx="118" cy="95" rx="200" ry="130" fill="url(#glow)"/>

    <g fill="none" stroke="#6ee7d8" stroke-opacity="0.09">
      <circle cx="1058" cy="95" r="120"/>
      <circle cx="1058" cy="95" r="172"/>
      <circle cx="1058" cy="95" r="224"/>
    </g>

    <g stroke="#6ee7d8" stroke-opacity="0.28" stroke-width="1" fill="#6ee7d8">
      <path d="M726 130 L802 96 L864 114 L930 64" fill="none"/>
      <circle cx="726" cy="130" r="2.3" fill-opacity="0.55" stroke="none"/>
      <circle cx="802" cy="96" r="2.9" fill-opacity="0.8" stroke="none"/>
      <circle cx="864" cy="114" r="2.1" fill-opacity="0.5" stroke="none"/>
      <circle cx="930" cy="64" r="2.7" fill-opacity="0.7" stroke="none"/>
      <circle cx="1012" cy="142" r="2.1" fill-opacity="0.4" stroke="none"/>
      <circle cx="1092" cy="54" r="1.7" fill-opacity="0.35" stroke="none"/>
      <circle cx="1150" cy="122" r="1.6" fill-opacity="0.3" stroke="none"/>
    </g>

    <circle cx="96" cy="95" r="49" fill="#08111d" stroke="#d8b36a" stroke-opacity="0.55" stroke-width="1.3"/>
    <circle cx="96" cy="95" r="42" fill="none" stroke="#d8b36a" stroke-opacity="0.2"/>
    <circle cx="96" cy="52" r="2.6" fill="#6ee7d8" fill-opacity="0.85"/>
    <text x="96" y="110" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#f6f1e7">M</text>

    <text x="176" y="56" font-family="Arial, Helvetica, sans-serif" font-size="13.2" letter-spacing="3" fill="#6ee7d8" fill-opacity="0.85">ARCHITETTURA COGNITIVA PER AGENTI AI</text>
    <text x="176" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="50" letter-spacing="10.5" fill="#f6f1e7">MNEMOSINE</text>
    <rect x="176" y="128" width="164" height="1.4" fill="url(#rule)"/>
    <text x="356" y="136" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#c7ae82">memoria, identità e iniziativa</text>
  </g>
  <rect x="0.6" y="0.6" width="1198.8" height="188.8" rx="15.4" fill="none" stroke="#d8b36a" stroke-opacity="0.16"/>
</svg>
